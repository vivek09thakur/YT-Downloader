# Render Blueprint - https://render.com/docs/blueprint-spec
# `name` must match the existing web service in the Render Dashboard so the Blueprint adopts it.
# Python version comes from .python-version (remove `plan` to keep an existing paid plan).
services:
  - type: web
    name: yt-with-ease
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
